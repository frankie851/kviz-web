<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Připravujeme… · Coming soon</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #f6f3ff; --fg: #231942; --muted: #5e548e; --accent: #7b2cbf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17122b; --fg: #f3efff; --muted: #b8afe0; --accent: #c77dff; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .znak { font-size: 64px; line-height: 1; }
  h1 { margin: 16px 0 8px; font-size: clamp(28px, 7vw, 44px); }
  p { margin: 4px 0; color: var(--muted); font-size: 18px; }
  .en { margin-top: 24px; }
  b { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="znak" aria-hidden="true">❓</div>
  <h1>Připravujeme…</h1>
  <p>Kvízová hra s tisíci <b>ověřených</b> otázek – česky i anglicky.</p>
  <p class="en" lang="en"><b>Coming soon</b> – a quiz game with thousands of verified questions in Czech and English.</p>
</main>
</body>
</html>
